<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160b18">
  <meta name="description" content="Acesse o grupo VIP no Telegram.">
  <title>Grupo VIP • Acesso Exclusivo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 47, 145, .24), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(151, 55, 255, .20), transparent 35%),
        #100b13;
    }
    .card {
      width: min(100%, 420px); overflow: hidden; text-align: center;
      background: rgba(29, 18, 32, .96); border: 1px solid rgba(255, 120, 190, .28);
      border-radius: 26px; box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }
    .photo-wrap { position: relative; height: 390px; overflow: hidden; }
    .photo {
      width: 100%; height: 100%; object-fit: cover; object-position: center 30%;
      display: block; filter: saturate(1.04);
    }
    .photo-wrap::after {
      content: ""; position: absolute; inset: 35% 0 0;
      background: linear-gradient(transparent, rgba(29,18,32,.98));
    }
    .badge {
      position: absolute; z-index: 1; top: 16px; left: 50%; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px; white-space: nowrap;
      background: rgba(15,8,17,.72); border: 1px solid rgba(255,255,255,.24);
      font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
    }
    .content { position: relative; margin-top: -48px; z-index: 2; padding: 0 24px 28px; }
    .eyebrow { color: #ff82bf; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; font-weight: 800; }
    h1 { margin: 10px 0 9px; font-size: clamp(27px, 7vw, 34px); line-height: 1.08; }
    p { color: #d8cbd9; font-size: 14px; line-height: 1.55; margin: 0 auto 20px; }
    .button {
      display: block; width: 100%; padding: 17px 14px; border-radius: 14px;
      color: #fff; text-decoration: none; font-weight: 900; font-size: 15px;
      letter-spacing: .4px; background: linear-gradient(100deg, #ff2f91, #a83cff);
      box-shadow: 0 10px 28px rgba(255,47,145,.25); transition: transform .15s ease, filter .15s ease;
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .telegram { margin-top: 14px; color: #a99baa; font-size: 11px; }
    .footer { padding: 0 20px 20px; color: #837786; font-size: 10px; }
    @media (max-width: 380px) { .photo-wrap { height: 340px; } .content { padding-left: 18px; padding-right: 18px; } }
  </style>
</head>
